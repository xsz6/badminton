<style>
:root{--bg:#f4f7f3;--ink:#14261f;--mute:#53675e;--green:#1d5a46;--line:#d5dfd8;--hi:#e9c844;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b16;--ink:#e8efe9;--mute:#9fb3a8;--green:#6fc2a0;--line:#26382f;--card:#16261f}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
h1,h2,h3{font-family:"Noto Serif SC",Songti SC,SimSun,serif;line-height:1.35;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:auto;padding:10px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{font-family:"Noto Serif SC",serif;font-weight:700;font-size:19px;text-decoration:none;margin-right:auto}
nav{display:flex;gap:4px 14px;flex-wrap:wrap}
nav a{text-decoration:none;font-size:15px;color:var(--mute);padding:2px 0;border-bottom:2px solid transparent}
nav a:hover,nav a.on{color:var(--ink);border-color:var(--hi)}
main{max-width:1080px;margin:auto;padding:0 20px 64px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;padding:56px 0 40px}
.hero h1{font-size:clamp(32px,5vw,52px)}
.hero p{color:var(--mute);max-width:30em;margin:16px 0 24px}
.btn{display:inline-block;background:var(--green);color:var(--bg);padding:10px 22px;border-radius:4px;text-decoration:none;font-weight:500;margin-right:10px}
.btn.o{background:none;color:var(--ink);border:1px solid var(--ink)}
.court{width:100%;height:auto}
.court *{vector-effect:non-scaling-stroke}
h2.t{font-size:24px;margin:48px 0 8px}
.sub{color:var(--mute);margin:0 0 20px}
.idx{border-top:2px solid var(--ink)}
.row{display:grid;grid-template-columns:170px 1fr;gap:8px 28px;padding:18px 0;border-bottom:1px solid var(--line)}
.row h3{font-size:19px}
.row h3 a{text-decoration:none}
.row h3 a:hover{color:var(--green);text-decoration:underline}
.row p{margin:0 0 6px;color:var(--mute);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px}
.chips a{color:var(--green)}
.path{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.path div{border-left:4px solid var(--hi);padding:2px 0 2px 14px}
.path b{display:block;font-family:"Noto Serif SC",serif}
.path span{color:var(--mute);font-size:15px}
.crumb{font-size:14px;color:var(--mute);padding:28px 0 8px}
.crumb a{color:var(--green)}
.art{max-width:44em}
.art h1{font-size:clamp(28px,4vw,40px);margin-bottom:12px}
.art h2{font-size:22px;margin:36px 0 10px}
.art h3{font-size:18px;margin:22px 0 6px}
.art blockquote{margin:16px 0;padding:8px 16px;border-left:4px solid var(--hi);background:var(--card)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;margin:12px 0}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--card)}
.list a{display:block;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none}
.list a:hover{color:var(--green)}
.list small{color:var(--mute);margin-left:8px}
/*nx*/.nx{margin:48px 0 0;padding:20px;border:1px solid var(--line);background:var(--card);border-radius:4px}.nx .r{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.nx .r a{color:var(--green)}.nx .r a.btn{margin:0;color:var(--bg);text-decoration:none}.nx label{display:block;margin-top:14px;font-size:15px;color:var(--mute)}#cd{font-size:14px;color:var(--green);min-height:1.5em;margin-top:4px}
footer{border-top:1px solid var(--line);padding:28px 20px;text-align:center;color:var(--mute);font-size:14px}
@media(max-width:760px){.hero{grid-template-columns:1fr;gap:24px;padding-top:32px}.row{grid-template-columns:1fr}.path{grid-template-columns:1fr}}
</style>
</head>

var GRIP='<p>握拍是所有技术的起点。握得对，发力才顺、转换才快；握错了，后面的动作都会别扭，还容易伤手腕。</p>'+
'<h2>正手握拍</h2><p>像“和球拍握手”：</p><ol><li>拍面与地面垂直，持拍手握住拍柄。</li><li><b>虎口对准握把窄面棱边</b>。</li><li>拇指与中指自然扣住两侧，食指稍微张开。</li><li>掌心与握把之间留一点空隙，柄尾露出约 1 厘米。</li></ol><p>用于高远球、杀球、吊球、正手发球等。</p>'+
'<h2>反手握拍</h2><ol><li>先摆好正手握拍。</li><li>用手指把拍柄向内转约 45 度。</li><li><b>拇指内侧顶住握把宽面</b>，这是反手发力的支点。</li></ol><p>用于反手高远球、挑球、放网、抽球等。</p>'+
'<div class="tw"><table><tr><th>项目</th><th>正手</th><th>反手</th></tr><tr><td>虎口</td><td>对准窄面棱边</td><td>随拍柄内转</td></tr><tr><td>拇指</td><td>扣住握把侧面</td><td>顶在宽面</td></tr><tr><td>食指</td><td>稍张开</td><td>稍向下移</td></tr></table></div>'+
'<h2>松与紧</h2><blockquote>平时松握，击球瞬间握紧，击球后立刻放松。</blockquote><p>握得太紧会让手腕僵硬、前臂酸痛、正反手转换变慢。</p>'+
'<h2>常见错误</h2><div class="tw"><table><tr><th>错误</th><th>纠正</th></tr><tr><td>握锤子式，手掌包死握把</td><td>用手指握拍，掌心留空</td></tr><tr><td>握得太紧</td><td>平时放松，击球时才发力</td></tr><tr><td>虎口对着宽面</td><td>对准窄面棱边再握</td></tr><tr><td>反手拇指没顶住</td><td>拇指内侧顶宽面</td></tr><tr><td>靠另一只手转拍</td><td>练习用手指转动</td></tr></table></div>'+
'<h2>练习</h2><ul><li>每天 5 分钟：对镜检查虎口、拇指、食指位置。</li><li>站立切换：在准备姿势下反复切换正反手，拍面不晃。</li><li>空挥拍：体会“松—紧—松”。</li></ul>';
var START='<p>羽毛球门槛低、上手快、运动量适中，是最适合入门的球类运动之一。这篇文章帮你在第一次上场前，搞清楚最基本的事。</p>'+
'<h2>一、先了解这项运动</h2><p>双方隔网对打，把球打过网并落在对方场地内得分。</p><ul><li><b>单打</b>：一对一</li><li><b>双打</b>：二对二（男双、女双、混双）</li></ul><p>比赛为三局两胜、每球得分。现行赛制每局先得 21 分者胜；国际羽联已确定自 2027 年 1 月 4 日起，标准赛制改为每局 15 分（21 分制保留为可选赛制），具体以你参加的比赛规定为准。本站规则部分先按现行 21 分制介绍。</p>'+
'<h2>二、认识场地</h2><div class="tw"><table><tr><th>项目</th><th>尺寸</th></tr><tr><td>场地长度</td><td>13.4 米</td></tr><tr><td>双打宽度</td><td>6.1 米</td></tr><tr><td>单打宽度</td><td>5.18 米</td></tr><tr><td>球网高度（中间）</td><td>1.524 米</td></tr><tr><td>球网高度（立柱处）</td><td>1.55 米</td></tr></table></div><ul><li>单打用内侧边线，双打用外侧边线。</li><li>发球有专门的发球区，必须斜线发到对角区域。</li></ul>'+
'<h2>三、准备基本装备</h2><h3>必备</h3><ul><li><b>球拍</b>：入门级即可，不必追求高价。</li><li><b>羽毛球</b>：练习可用耐打的球。</li><li><b>运动鞋</b>：选羽毛球专用鞋，防滑、有侧向支撑。</li></ul><h3>可选</h3><p>手胶、护腕、护膝、护踝、毛巾、水杯、运动袜。</p><blockquote>不要穿跑鞋打羽毛球。跑鞋侧向支撑不足，急停转向时容易受伤。</blockquote>'+
'<h2>四、学会正确握拍</h2><p>握拍是所有技术的起点。正手像“和球拍握手”，虎口对准窄面棱边；反手在正手基础上，拇指顶住宽面。握拍要松，击球瞬间才用力握紧。</p><p><a href="#/beginner/grip">查看握拍方法详解</a></p>'+
'<h2>五、掌握准备姿势</h2><ul><li>两脚与肩同宽或稍宽。</li><li>膝盖微屈，重心放在前脚掌。</li><li>持拍手在身前，拍头抬起。</li><li>眼睛盯着对方和球。</li></ul><p>击球后立刻回到这个姿势。</p>'+
'<h2>六、先学这五个基本动作</h2><h3>1. 发球</h3><p>入门先学正手发高远球和反手发网前球。规则要求：击球瞬间整个球必须低于地面 1.15 米，发球前双脚各有一部分接触地面并保持不动，挥拍动作要连续。</p><h3>2. 高远球</h3><p>把球从后场打到对方后场的高球，是最基础的技术，能为自己争取回位时间。</p><h3>3. 吊球</h3><p>把球轻轻打到对方网前，常与高远球配合变换节奏。</p><h3>4. 杀球</h3><p>大力向下压球，威胁大。新手先把高远球打稳，再学杀球。</p><h3>5. 网前球</h3><p>包括放网、搓球、挑球，需要手腕和手指的细腻控制。</p>'+
'<h2>七、步伐比挥拍更重要</h2><p>很多新手只练挥拍，结果球到了却跑不到位。</p><ul><li><b>并步</b>：两脚交替侧向移动</li><li><b>垫步</b>：小幅跳动调整位置</li><li><b>交叉步</b>：后场移动时使用</li><li><b>上网步法</b>：向前场迈步，最后一步弓步到位</li></ul><p>步伐要小步快速，每次击球后回到中心位置，先练步伐再带球练习。</p>'+
'<h2>八、基础规则</h2><ul><li>每球得分制，现行赛制先到 21 分获胜；20 平需领先 2 分；29 平时先得第 30 分者胜。（2027 年 1 月 4 日起标准赛制改为每局 15 分：14 平需领先 2 分，20 平时下一分决胜。）</li><li>发球方得分为偶数时，从右发球区发球；为奇数时，从左发球区发球。</li><li>常见违例：球落界外、球触网或穿网、击球时球拍触网、同一方连续击球两次。</li></ul>'+
'<h2>九、热身与防伤</h2><p>上场前热身 5 到 10 分钟：慢跑或原地小跳，肩、腕、腰绕环，腿部拉伸，活动脚踝。常见受伤部位是脚踝、膝盖、肩膀和手肘，感到疼痛应立即停止。</p>'+
'<h2>十、新手练习建议</h2><div class="tw"><table><tr><th>阶段</th><th>内容</th></tr><tr><td>第 1 到 2 周</td><td>熟悉握拍和准备姿势，对高远球，学基本发球</td></tr><tr><td>第 3 到 4 周</td><td>练高远球、吊球，加入基础步伐，与朋友轻松对打</td></tr><tr><td>第 5 周起</td><td>学杀球和网前技术，进行单双打实战，了解简单战术</td></tr></table></div><p>动作标准比力量重要；多看别人打球，多复盘自己的问题。</p>'+
'<h2>常见问题</h2><h3>必须买贵球拍吗？</h3><p>不需要。入门阶段几十到一两百元的球拍足够。</p><h3>为什么总是打不到球？</h3><p>多半是步伐没跟上或击球点没找准，先练步伐，再练挥拍。</p><h3>手腕累、手臂酸怎么办？</h3><p>可能是握拍太紧或发力不对。放松握拍，学会用身体带动手臂。</p><h3>一周打几次合适？</h3><p>新手每周 2 到 3 次，每次 1 到 2 小时，注意休息。</p>';
var COURT='<p>打球之前，先看懂场地、认清线条、了解基本术语。这篇文章帮你快速搞清楚这些基础知识。</p>'+
'<h2>一、标准场地尺寸</h2><p>羽毛球场是长方形，中间用球网分成两个半场。</p><div class="tw"><table><tr><th>项目</th><th>尺寸</th></tr><tr><td>场地全长</td><td>13.40 米</td></tr><tr><td>双打场地宽度</td><td>6.10 米</td></tr><tr><td>单打场地宽度</td><td>5.18 米</td></tr><tr><td>球网高度（中间）</td><td>1.524 米</td></tr><tr><td>球网高度（立柱处）</td><td>1.55 米</td></tr><tr><td>前发球线距球网</td><td>1.98 米</td></tr><tr><td>双打后发球线距底线</td><td>0.76 米</td></tr></table></div><p>球网立柱立在双打边线上。场地上方的空间同样重要：正式比赛要求净空约 9 米，业余球馆通常在 7 到 8 米以上，太低的话高远球容易碰顶。</p>'+
'<h2>二、场地线条怎么认</h2><div class="tw"><table><tr><th>线条</th><th>作用</th></tr><tr><td>底线</td><td>场地两端的边界线</td></tr><tr><td>单打边线</td><td>单打时左右两侧的边界（内侧线）</td></tr><tr><td>双打边线</td><td>双打时左右两侧的边界（外侧线）</td></tr><tr><td>前发球线</td><td>距球网 1.98 米，发球必须越过此线</td></tr><tr><td>中线</td><td>把发球区分成左右两个</td></tr><tr><td>双打后发球线</td><td>双打发球时，球不能越过此线</td></tr></table></div><h3>记忆口诀</h3><ul><li>单打用内侧边线，双打用外侧边线。</li><li>单打发球可以发到底线，双打发球只能到双打后发球线。</li><li>发球必须越过前发球线。</li></ul>'+
'<h2>三、发球区</h2><p>场地被中线和发球线分成左右两个发球区，发球必须斜线发到对角的发球区。</p><ul><li><b>单打</b>：发球区长而窄，球可以发到底线，但不能越过单打边线。</li><li><b>双打</b>：发球区短而宽，球不能越过双打后发球线，可以到双打外侧边线。</li></ul>'+
'<h2>四、球网</h2><ul><li>网的上沿有一条白色网带，约 7.5 厘米宽。</li><li>比赛中球拍或身体触网，都算违例。</li><li>球擦网后过网并落在对方界内，仍然有效。</li></ul>'+
'<h2>五、认识羽毛球</h2><p>羽毛球由<b>球头</b>（软木制成，外包皮革或合成材料）和<b>球裙</b>（16 根羽毛）组成。</p><div class="tw"><table><tr><th>类型</th><th>特点</th><th>适用</th></tr><tr><td>鹅毛球</td><td>飞行稳定，质量好</td><td>正式比赛、较高水平</td></tr><tr><td>鸭毛球</td><td>价格较低，耐打度一般</td><td>日常练习、业余比赛</td></tr><tr><td>塑料球</td><td>耐打、便宜</td><td>新手练习、户外</td></tr></table></div><h3>球速</h3><p>羽毛球按速度分为 76、77、78 等型号，数字越大，球速越快、飞得越远。气温低选速度快的球，气温高选速度慢的球。</p>'+
'<h2>六、认识球拍</h2><ul><li><b>拍头</b>：由拍框和球线组成，用来击球。</li><li><b>拍杆</b>：连接拍头和握把。</li><li><b>T 型接头</b>：拍框与拍杆的连接处。</li><li><b>握把</b>：手握的部位，通常缠有手胶。</li></ul><p>入门选择碳纤维或铝碳一体的拍子即可。</p>'+
'<h2>七、常用术语</h2><div class="tw"><table><tr><th>术语</th><th>含义</th></tr><tr><td>前场 / 中场 / 后场</td><td>靠近球网 / 场地中部 / 靠近底线的区域</td></tr><tr><td>高远球</td><td>把球打到对方后场的高球</td></tr><tr><td>杀球</td><td>大力向下压球</td></tr><tr><td>吊球</td><td>轻轻把球打到对方网前</td></tr><tr><td>挑球</td><td>从网前把球挑高打到对方后场</td></tr><tr><td>平抽球</td><td>与肩同高、平行于地面的快速对攻球</td></tr><tr><td>违例</td><td>违反规则的行为</td></tr></table></div>'+
'<h2>八、基本比赛常识</h2><ul><li>比赛项目：男单、女单、男双、女双、混双。</li><li>每球得分，三局两胜。现行赛制每局 21 分；20 平需领先 2 分，29 平时先得第 30 分者胜。</li><li>国际羽联已确定自 2027 年 1 月 4 日起改为每局 15 分（14 平需领先 2 分，20 平时下一分决胜），21 分制保留为可选赛制。</li><li>赛前通过抛硬币决定先发球或选场地；局间换场。现行赛制下，决胜局一方先得 11 分时也换场（15 分制下为先得 8 分）。</li></ul>'+
'<h2>九、礼仪与安全</h2><ul><li>赛前与对手握手致意，对判罚有疑问时礼貌沟通。</li><li>打球前检查地面有无水迹、杂物。</li><li>留意相邻场地飞来的球，避免撞人。</li><li>穿羽毛球专用鞋，打完及时补水。</li></ul>'+
'<h2>常见问题</h2><h3>球压线算界内吗？</h3><p>算。球落在线上，视为界内球。</p><h3>单打和双打场地为什么宽度不同？</h3><p>双打场上有四个人，所以更宽；但双打发球区更短，限制了发球的攻击性。</p><h3>业余球馆的场地一定标准吗？</h3><p>多数按标准划线，但有些球馆场间距小、顶部低，选馆时要留意。</p>'+

var READY='<p>不管打什么球，都要先回到准备姿势。姿势对了，才能快速启动、及时击球。</p>'+
'<h2>一、标准准备姿势</h2><ul><li><b>双脚</b>：与肩同宽或稍宽，左右脚可略前后错开。</li><li><b>膝盖</b>：微屈，身体放低一点。</li><li><b>重心</b>：放在前脚掌，脚跟轻轻离地或轻触地面。</li><li><b>持拍手</b>：在身体前方，拍头抬起，不要垂下。</li><li><b>非持拍手</b>：自然抬起，帮助保持平衡。</li><li><b>眼睛</b>：盯着对方和球。</li></ul>'+
'<h2>二、基本站位</h2><h3>单打</h3><p>击球后回到场地中心位置（中线附近，略靠后一点），这样到前后左右四个方向的距离都最短。</p><h3>双打</h3><ul><li><b>前后站位</b>：一人在前场，一人在后场，常用于进攻。</li><li><b>左右站位</b>：两人各守半场，常用于防守。</li></ul>'+
'<h2>三、启动：垫步</h2><p>对手击球的瞬间，做一个小幅度的垫步（原地小跳），让双脚同时落地，再向球的方向蹬出。有了垫步，启动更快，也不容易被打反向。</p>'+
'<h2>四、常见错误</h2><div class="tw"><table><tr><th>错误</th><th>后果</th><th>纠正</th></tr><tr><td>站得太直、膝盖不弯</td><td>启动慢</td><td>膝盖微屈，重心下沉</td></tr><tr><td>脚跟着地站死</td><td>反应迟钝</td><td>重心放在前脚掌</td></tr><tr><td>拍头垂下</td><td>举拍慢，击球点偏低</td><td>拍头抬起，拍子在身前</td></tr><tr><td>击球后站在原地</td><td>下一拍来不及</td><td>每次击球后立刻回中心</td></tr></table></div>'+
'<h2>五、练习方法</h2><ul><li>对镜检查姿势，每次 1 分钟。</li><li>准备姿势加垫步：听口令向前后左右启动，再回中心。</li><li>每次练球间歇，都回到准备姿势再接下一球。</li></ul>'+

var SERVE='<p>每个回合都从发球开始。发球不难，但规则要求严格，新手先学会守规矩，再练准确。</p>'+
'<h2>一、发球规则</h2><ul><li>发球方站在自己的发球区，把球斜线发到对角的发球区。</li><li>击球瞬间，整个球必须低于地面 1.15 米（国际羽联现行规则，约在腰部附近）。</li><li>双脚各有一部分接触地面，发球前保持不动。</li><li>双脚必须有一部分接触地面，且发球前不能移动、不能提前离地。</li><li>挥拍动作要连续，不能故意停顿或做假动作。</li></ul>'+
'<h2>二、从哪个发球区发</h2><ul><li>发球方得分为偶数（0、2、4……）：从右发球区发球。</li><li>发球方得分为奇数（1、3、5……）：从左发球区发球。</li></ul>'+
'<h2>三、正手发高远球</h2><p>把球发到对方后场，球飞得高，落点深，新手最常用，单打中常见。</p><ol><li>面向球网，站在发球区靠前位置，两脚前后站开。</li><li>非持拍手拿球，置于身体前方，持拍手向后引拍。</li><li>放球后，利用转体和前臂，由下向上挥拍击球。</li><li>击球后自然随挥，立刻回到准备姿势。</li></ol><p>要点：放球要稳，击球点在身体前侧；把球打高，让它垂直落向对方底线。</p>'+
'<h2>四、发网前球</h2><p>把球轻轻送过网，贴网落到对方前发球线附近，双打中最常用。</p><h3>反手发网前球</h3><ol><li>用反手握拍，站在靠近前发球线的位置。</li><li>拍子放在身体前方，球放在拍面前方。</li><li>手腕和手指轻推，让球贴网而过。</li></ol><p>要点：动作小，不要抡臂；球过网点越低，落点越近网，对手越难进攻。</p>'+
'<h2>五、发球常见错误</h2><div class="tw"><table><tr><th>错误</th><th>纠正</th></tr><tr><td>击球点太高（超过 1.15 米）</td><td>放球位置压低，保证击球时球在 1.15 米以下</td></tr><tr><td>脚提前移动或离地</td><td>双脚站稳，击球后再动</td></tr><tr><td>发球不过前发球线</td><td>加一点力度，增加弧度</td></tr><tr><td>发球出界</td><td>单打可发到底线，双打别超过后发球线</td></tr></table></div>'+
'<h2>六、练习方法</h2><ul><li>对着前发球线练：每次发球看是否过线。</li><li>在场地一侧放一个目标，比如毛巾，练落点。</li><li>每天固定发 30 到 50 个球，保证动作一致。</li></ul>'+

var WARM='<p>羽毛球里急停、转身、起跳很多，不热身直接上场，很容易拉伤或崴脚。热身花不了多久，却能明显降低受伤风险。</p>'+
'<h2>一、上场前热身（5 到 10 分钟）</h2><p>热身以<b>动态活动</b>为主，让身体发热、关节活动开。</p><div class="tw"><table><tr><th>部位</th><th>动作</th><th>时间或次数</th></tr><tr><td>全身</td><td>慢跑、开合跳</td><td>2 到 3 分钟</td></tr><tr><td>脚踝</td><td>脚尖点地转圈，左右各一</td><td>每侧 10 圈</td></tr><tr><td>膝盖</td><td>双手扶膝，顺逆时针绕环</td><td>每方向 10 圈</td></tr><tr><td>髋与腿</td><td>前后摆腿、弓步走</td><td>每侧 10 次</td></tr><tr><td>腰部</td><td>转体、绕环</td><td>10 到 15 次</td></tr><tr><td>肩部</td><td>肩绕环、手臂绕圈</td><td>每方向 10 次</td></tr><tr><td>手腕</td><td>手腕绕环</td><td>每方向 10 圈</td></tr></table></div><p>最后做几次空挥拍和几步基本步伐，再开始打球。</p>'+
'<h2>二、打完球的拉伸</h2><p>运动后做<b>静态拉伸</b>，每个动作保持 15 到 30 秒，感觉到拉紧即可，不要拉到疼。</p><ul><li><b>大腿前侧</b>：站立，抓住脚踝向臀部拉。</li><li><b>大腿后侧</b>：坐姿或站姿前屈，向脚尖方向伸。</li><li><b>小腿</b>：弓步后腿伸直，脚跟压地。</li><li><b>肩与手臂</b>：一手横过胸前，另一手拉住。</li><li><b>前臂</b>：手臂前伸，另一手向下压手掌。</li></ul>'+
'<h2>三、注意事项</h2><ul><li>先热身再拉伸，不要在身体没热的时候用力压腿。</li><li>拉伸时正常呼吸，不要憋气，不要弹震。</li><li>冬天或早晨，热身时间适当延长。</li><li>感到关节疼痛应立即停止，不要硬撑。</li></ul>'+

'<h2>计划总览</h2><div class="tw"><table><tr><th>周次</th><th>重点</th><th>每次练习内容</th></tr><tr><td>第 1 周</td><td>握拍、姿势、基本发球</td><td>握拍与姿势 10 分钟；原地挥拍 15 分钟；正手发高远球 20 分钟；与朋友轻松对高远球</td></tr><tr><td>第 2 周</td><td>高远球、基础步法</td><td>并步、垫步 15 分钟；对高远球 30 分钟；练习回中心位置</td></tr><tr><td>第 3 周</td><td>吊球、网前</td><td>步法复习 10 分钟；高远球加吊球 25 分钟；放网、搓球入门 20 分钟</td></tr><tr><td>第 4 周</td><td>杀球入门、实战</td><td>高远球、吊球回顾 20 分钟；杀球分解练习 15 分钟；轻松比赛 30 分钟</td></tr></table></div>'+

var CLEAR='<p>高远球是把球从自己的后场打到对方后场底线附近的高球。它是羽毛球最基础的技术，也是学会杀球和吊球的前提。</p>'+
'<h2>一、高远球有什么用</h2><ul><li><b>防守</b>：球飞得高，给自己争取回位时间。</li><li><b>调动对手</b>：把对方压到后场，打开前场空档。</li><li><b>过渡</b>：为后面的杀球、吊球创造机会。</li></ul>'+
'<h2>二、正手高远球动作要领</h2><ol><li><b>侧身准备</b>：判断来球后，迅速移动到球的后方，身体侧对球网，非持拍手抬起指向来球。</li><li><b>引拍</b>：持拍手屈肘，拍头向后下方放松垂下，肘部抬起。</li><li><b>发力</b>：蹬地转体，带动髋、肩，再依次挥动上臂、前臂。</li><li><b>击球</b>：在右肩上方稍靠前的最高点击球，前臂内旋，手腕和手指在击球瞬间收紧。</li><li><b>收拍</b>：击球后顺势随挥，立即回到中心位置。</li></ol><blockquote>发力顺序是：腿 → 腰 → 肩 → 手臂 → 手腕，而不是只用手臂甩。</blockquote>'+
'<h2>三、常见错误</h2><div class="tw"><table><tr><th>错误</th><th>后果</th><th>纠正</th></tr><tr><td>击球点在头顶后方</td><td>球飞不远，打不到</td><td>步伐到位，在最高点前方击球</td></tr><tr><td>只用手臂发力</td><td>球软、手臂酸</td><td>先练蹬转，再带动挥臂</td></tr><tr><td>握拍太紧</td><td>手腕发不出力</td><td>放松握拍，击球瞬间才握紧</td></tr><tr><td>身体正对球网</td><td>转体不充分</td><td>先侧身，再发力</td></tr><tr><td>击球后站在原地</td><td>回位慢</td><td>击球后立即回中心</td></tr></table></div>'+
'<h2>四、练习方法</h2><ul><li><b>空挥拍</b>：对镜检查侧身、引拍、击球点，每次 20 下。</li><li><b>两人对高远球</b>：目标是把球稳定打到对方后场底线附近。</li><li><b>定点练习</b>：在后场放目标物，练习落点。</li><li><b>结合步伐</b>：先向后场移动，再击球，击完回中心。</li></ul>';
var SMASH='<p>杀球是向下大力压球，球速快、威胁大，是主要的得分手段。新手先把高远球打稳，再学杀球。</p>'+
'<h2>一、杀球和高远球有什么区别</h2><div class="tw"><table><tr><th>项目</th><th>高远球</th><th>杀球</th></tr><tr><td>击球点</td><td>头顶偏后上方</td><td>头顶更靠前</td></tr><tr><td>拍面</td><td>向前上方</td><td>向前下方</td></tr><tr><td>球路</td><td>高而深</td><td>快速向下</td></tr><tr><td>目的</td><td>防守、调动</td><td>进攻、得分</td></tr></table></div>'+
'<h2>二、正手杀球动作要领</h2><ol><li><b>步伐到位</b>：移动到球的后方，侧身准备。</li><li><b>引拍</b>：与高远球类似，肘抬高，身体后仰成弓形。</li><li><b>发力</b>：蹬转带动，挥臂加速。</li><li><b>击球</b>：在身体前上方的最高点，击球后上部，拍面向前下压，手腕快速下压。</li><li><b>收拍回位</b>：随挥后迅速回中心位置。</li></ol><p>击球点比高远球更靠前，是杀球的关键。</p>'+
'<h2>三、常用杀球类型</h2><ul><li><b>直线杀</b>：沿边线杀向对方。</li><li><b>对角杀</b>：杀向对方斜对角，跑动距离长。</li><li><b>劈杀</b>：手腕带有切削，球路更斜、落点更靠近。</li><li><b>跳杀</b>：起跳击球，球速更快、角度更陡，要求较高。</li></ul>'+
'<h2>四、常见错误</h2><div class="tw"><table><tr><th>错误</th><th>纠正</th></tr><tr><td>击球点靠后，球飞出界</td><td>步伐到位，在前上方击球</td></tr><tr><td>只用手臂，没有身体发力</td><td>先练蹬转，再配合挥臂</td></tr><tr><td>杀球下网</td><td>拍面不要过早下压，在最高点击球</td></tr><tr><td>杀完球不回位</td><td>击球后立即回中心</td></tr></table></div>'+
'<h2>五、练习与安全</h2><ul><li>先做空挥，再对着目标练习落点。</li><li>杀球后接对方回球，练习回位。</li><li>杀球对肩、肘负担较大，先热身，疼痛时立即停止。</li><li>不要每球都杀，高远球和吊球配合才有效。</li></ul>';
var DROP='<p>吊球是把球轻轻打到对方网前，球过网后迅速下坠。它和高远球、杀球配合，能打乱对手节奏。</p>'+
'<h2>一、吊球的作用</h2><ul><li>迫使对方从后场跑到前场。</li><li>与杀球、高远球配合，打乱节奏。</li><li>消耗对手体力，制造空档。</li></ul>'+

var FOOT='<p>步伐决定你能不能及时到位。球拍技术再好，到不了位也打不出好球。</p>'+
'<h2>一、基础步法</h2><div class="tw"><table><tr><th>步法</th><th>用途</th><th>要点</th></tr><tr><td>垫步</td><td>启动前的小跳</td><td>对手击球瞬间双脚同时落地</td></tr><tr><td>并步</td><td>左右移动</td><td>一脚带动另一脚，小步快速</td></tr><tr><td>交叉步</td><td>后场移动</td><td>一脚从后方交叉，身体侧转</td></tr><tr><td>蹬跨步</td><td>上网</td><td>最后一步大步，弓步到位</td></tr></table></div>'+
'<h2>二、上网步法</h2><ol><li>从中心位置出发，做垫步。</li><li>向前场方向迈步，最后一步大步蹬出，脚跟先着地。</li><li>弓步落地，膝盖与脚尖方向一致。</li><li>击球后蹬地回到中心。</li></ol><p>前脚膝盖不要内扣，以免受伤。</p>'+
'<h2>三、后场步法</h2><ol><li>判断来球后，侧身退步。</li><li>用并步或交叉步，快速移动到球的后方。</li><li>击球时身体稳定，重心在后脚。</li><li>击球后快速回中心。</li></ol>'+
'<h2>四、米字步</h2><p>米字步是以中心位置为起点，向前左、前右、左侧、右侧、后左、后右六个方向移动，每次击球后回中心。它是练习综合步伐的基础训练。</p>'+
'<h2>五、步伐原则</h2><ul><li>小步快速，不要大步慢跑。</li><li>重心保持稳定，不要上下起伏。</li><li>每次击球后回中心。</li><li>先练步法，再带球练习。</li></ul>'+
'<h2>六、练习建议</h2><ul><li>无球练习：每个方向 10 次，做 3 组。</li><li>对镜检查姿势和重心。</li><li>慢速做标准，再加快速度。</li><li>步伐练习前充分热身，注意脚踝和膝盖。</li></ul>';
var NET='<p>网前技术是在前场处理来球的技术，讲究手指和手腕的细腻控制。网前控制好了，就能逼对方抬球，为自己创造进攻机会。</p>'+
'<h2>一、常见网前技术</h2><div class="tw"><table><tr><th>技术</th><th>作用</th><th>要点</th></tr><tr><td>放网</td><td>把球轻托过网，贴网下坠</td><td>拍面托球，动作小，击球点高</td></tr><tr><td>搓球</td><td>让球翻滚过网，增加对方回球难度</td><td>拍面切削球托，向侧上方搓动</td></tr><tr><td>勾球</td><td>把球勾向对角网前</td><td>手腕转动，拍面斜带，调动对手</td></tr><tr><td>推球</td><td>把球推向对方后场两角</td><td>手腕发力，球路平快</td></tr><tr><td>扑球</td><td>对方回球过高时，在网前向下压球</td><td>抢高点，拍面前压，动作小</td></tr></table></div>'+
'<h2>二、基本动作要领</h2><ol><li>用<b>蹬跨步</b>上网，最后一步大步弓步到位。</li><li>持拍手伸到身体前方，<b>击球点尽量在网的上沿附近</b>，越高越主动。</li><li>主要靠<b>手指和手腕</b>发力，手臂动作要小。</li><li>击球后立即蹬地回到中心。</li></ol><blockquote>规则提醒：击球点必须在自己一侧，不能在球过网前就把球拍伸到对方一侧击球。</blockquote>'+
'<h2>三、常见错误</h2><div class="tw"><table><tr><th>错误</th><th>纠正</th></tr><tr><td>击球点太低</td><td>步伐到位，在网上沿附近击球</td></tr><tr><td>动作太大</td><td>缩小引拍，用手指手腕控制</td></tr><tr><td>放网过高</td><td>拍面托球，让球过网后立刻下坠</td></tr><tr><td>上网后不回位</td><td>击球后立刻蹬回中心</td></tr></table></div>'+
'<h2>四、练习方法</h2><ul><li>两人网前对放，要求球贴网过去。</li><li>在对方网前放目标物，练落点。</li><li>放网、搓球、勾球轮换，练变化。</li></ul>';
var DEF='<p>挑球和接杀都是防守技术。防守稳，才能把被动变主动。</p>'+
'<h2>一、挑球</h2><p>挑球是在网前把球挑高，打到对方后场的技术，分正手和反手。</p><ul><li><b>挑高球</b>：弧线高，落点深，争取回位时间。</li><li><b>挑平快球</b>：弧线低而快，攻击性强，但要求更高。</li></ul><h3>动作要领</h3><ol><li>蹬跨步上网，伸臂到身前。</li><li>拍面朝上，前臂带动手腕向上挑出。</li><li>落点：对方后场底线附近。</li><li>击球后立刻回中心。</li></ol>'+
'<h2>二、接杀</h2><p>接杀是防守对方杀球的技术。对方杀球球速快，需要缩短动作、提前判断。</p><h3>动作要领</h3><ol><li>站位偏低，重心下沉，持拍手在身体前方。</li><li><b>引拍小</b>，不要向后大幅度引拍。</li><li>拍面稍微后仰，用前臂和手腕向前迎球。</li><li>接杀可以<b>挡网前</b>（轻拦球到对方网前），也可以<b>挑后场</b>。</li></ol>'+
'<h2>三、常见错误</h2><div class="tw"><table><tr><th>错误</th><th>纠正</th></tr><tr><td>接杀时大幅度引拍</td><td>缩小动作，拍子保持在身前</td></tr><tr><td>站位太高</td><td>降低重心，膝盖弯曲</td></tr><tr><td>挑球太短</td><td>用手腕向上送，把球挑到后场</td></tr><tr><td>被动接球后不回位</td><td>击球后立即回中心</td></tr></table></div>'+
'<h2>四、练习方法</h2><ul><li>两人一组：一人杀球，一人接杀。</li><li>练习接杀后挡网前和挑后场两种回球。</li><li>网前挑球对挑，要求落点深。</li></ul>';
var DRIVE='<p>平抽和挡网是中前场的快速技术，双打中使用很多。动作小，节奏快，反应要求高。</p>'+
'<h2>一、平抽球</h2><p>平抽球是球在肩部以下、与地面基本平行的快速对攻球。</p><h3>动作要领</h3><ol><li>准备姿势，拍头抬起，拍子在身前。</li><li>引拍动作小，主要靠<b>前臂和手腕</b>发力。</li><li>击球点在身体前侧，拍面对准来球方向。</li><li>击球后迅速收回拍子，准备下一拍。</li></ol><p>正手抽用前臂内旋带动，反手抽用前臂外旋带动。</p>'+
'<h2>二、挡网</h2><p>挡网是把对方来球轻挡到对方网前的技术，常用于接杀和接平抽。</p><ol><li>拍面稍微后仰，握拍放松。</li><li>不加力，靠来球的力量，轻轻迎球一挡。</li><li>球过网后下坠，落在对方网前。</li></ol>'+
'<h2>三、常见错误</h2><div class="tw"><table><tr><th>错误</th><th>纠正</th></tr><tr><td>引拍太大</td><td>缩小动作，拍子在身前</td></tr><tr><td>握拍太紧</td><td>放松握拍，击球瞬间握紧</td></tr><tr><td>反手拇指没顶住宽面</td><td>复习反手握拍</td></tr><tr><td>挡网过高</td><td>手腕放松，让球过网后下坠</td></tr></table></div>'+
'<h2>四、练习方法</h2><ul><li>两人平抽对打，要求动作小，节奏快。</li><li>正反手交替抽球。</li><li>一人杀球，一人用挡网回击，练网前落点。</li></ul>';
var SPECS='<p>球拍上的数字和字母看起来复杂，其实只要看懂几个核心参数，就能读懂一支球拍。</p>'+
'<h2>一、球拍的结构</h2><ul><li><b>拍头</b>：由拍框和球线组成，用来击球。</li><li><b>拍杆</b>：连接拍头和握把，决定软硬。</li><li><b>T 型接头</b>：拍框与拍杆的连接处。</li><li><b>握把</b>：手握的部位，通常缠有手胶。</li></ul>'+
'<h2>二、核心参数</h2><h3>1. 重量（U 数）</h3><p>U 数越小，球拍越重。下表为尤尼克斯的划分，是不含线和握把胶的重量，其他品牌略有差异。</p><div class="tw"><table><tr><th>U 数</th><th>重量（不含线）</th><th>特点</th></tr><tr><td>2U</td><td>约 90 到 94.9 克</td><td>偏重，力量大，要求高</td></tr><tr><td>3U</td><td>约 85 到 89.9 克</td><td>平衡力量与灵活</td></tr><tr><td>4U</td><td>约 80 到 84.9 克</td><td>轻便，新手常用</td></tr><tr><td>5U</td><td>约 75 到 79.9 克</td><td>很轻，灵活，力量偏小</td></tr></table></div>'+
'<h3>2. 平衡点</h3><div class="tw"><table><tr><th>类型</th><th>平衡点</th><th>特点</th></tr><tr><td>头重</td><td>约 295 毫米以上</td><td>杀球有力，挥动较吃力</td></tr><tr><td>平衡</td><td>约 285 到 295 毫米</td><td>攻守均衡</td></tr><tr><td>头轻</td><td>约 285 毫米以下</td><td>灵活，适合双打、防守</td></tr></table></div>'+
'<h3>3. 拍杆硬度</h3><ul><li><b>偏软</b>：弹性大，好发力，适合新手。</li><li><b>中等</b>：适合多数人。</li><li><b>偏硬、超硬</b>：控制精准，但需要较大挥速和力量。</li></ul>'+
'<h3>4. 握把尺寸</h3><p>常见 G4、G5 等标注，数字越大握把越细：G4 较粗，G5 更细。手较小的人选 G5 或更细，也可以通过缠手胶调整粗细，握着舒服、能灵活转动即可。</p>'+
'<h3>5. 磅数上限</h3><p>球拍上会标注建议的拉线磅数范围，常见如 20 到 30 磅，不要超过上限，否则有损坏风险。新手一般选范围中偏低的磅数。</p>'+
'<h2>三、材质</h2><ul><li><b>铝合金</b>：便宜，适合体验，手感一般。</li><li><b>碳纤维</b>：轻、硬度好，是主流选择。</li></ul>'+
'<h2>四、读懂标注示例</h2><p>如果球拍写着 “4U G5”，表示重量为 4U，握把规格为 G5。</p>';

'<h2>二、按打法选</h2><div class="tw"><table><tr><th>打法</th><th>倾向</th></tr><tr><td>进攻型</td><td>头重、杆偏硬，杀球更有力</td></tr><tr><td>防守反击型</td><td>头轻、杆偏软，转换灵活</td></tr><tr><td>双打为主</td><td>头轻或平衡，反应快</td></tr><tr><td>单打为主</td><td>平衡或略偏头重，后场更有力</td></tr></table></div>'+
'<h2>三、选购步骤</h2><ol><li>确定预算，入门阶段不必追求高价。</li><li>先看重量：从 4U 或 5U 起步。</li><li>再看平衡点和硬度：新手选头轻或平衡、偏软到中等。</li><li>握把粗细：握上手，能灵活转动为宜。</li><li>有条件先试打，感受挥动是否轻松。</li></ol>'+

'<h2>五、新手推荐</h2><p>碳纤维、4U 或 5U、头轻或平衡、杆偏软到中等，预算够用就行。先打一段时间，再根据自己的打法升级。</p>';
var STRING='<p>球线直接影响击球手感和控制。新手不用想得太复杂，掌握几个基本概念就够用。</p>'+
'<h2>一、球线的线径</h2><p>常见线径约 0.61 到 0.70 毫米。</p><div class="tw"><table><tr><th>线径</th><th>特点</th></tr><tr><td>细线（约 0.61 到 0.65 毫米）</td><td>弹性好、手感灵敏，但耐打度较差</td></tr><tr><td>中等（约 0.66 到 0.67 毫米）</td><td>兼顾弹性和耐打</td></tr><tr><td>粗线（约 0.68 到 0.70 毫米）</td><td>耐打，手感偏硬</td></tr></table></div><p>新手建议选偏粗、耐打的线。</p>'+
'<h2>二、磅数怎么选</h2><p>磅数指拉线的力度。1 磅约等于 0.45 千克。</p><div class="tw"><table><tr><th>磅数</th><th>特点</th></tr><tr><td>低磅数</td><td>弹性大，甜区大，省力</td></tr><tr><td>高磅数</td><td>控制精准，但甜区小，需要力量和技术</td></tr></table></div><ul><li><b>新手</b>：约 18 到 22 磅（约 8.2 到 10 千克），甜区大、省力。</li><li><b>进阶</b>：约 22 到 26 磅（约 10 到 11.8 千克），按自己的力量逐步调整。</li><li>磅数越高，甜区越小，球线也越不耐打。</li><li>不能超过球拍标注的磅数上限，常见上限为 24 到 30 磅。</li></ul>'+
